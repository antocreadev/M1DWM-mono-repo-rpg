<div class="flex flex-col items-center justify-center p-6 bg-gray-100 min-h-screen">
  <h1 class="text-3xl font-bold mb-8">RPG Board Game</h1>

  <div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full">
    <h2 class="text-xl font-semibold mb-4">Choisissez votre personnage</h2>

    <div class="grid grid-cols-3 gap-4 mb-6">
      <button
        *ngFor="let character of characterTypes"
        (click)="onSelect(character)"
        class="flex flex-col items-center p-4 border rounded-lg"
        [ngClass]="'hover:bg-' + character.color + '-100'"
      >
        <div
          class="w-16 h-16 rounded-full mb-2 flex items-center justify-center text-white text-2xl"
          [ngClass]="'bg-' + character.color + '-600'"
        >
          {{ character.name[0] }}
        </div>
        <span>{{ character.name }}</span>
        <span class="text-xs text-gray-500">{{ character.description }}</span>
      </button>
    </div>
  </div>
</div>
