<ng-container *ngIf="(gameState$ | async) as gameState">
  <!-- Écran de sélection du personnage -->
  <app-character-selection
    *ngIf="gameState === 'characterSelection'"
    (selectCharacter)="selectCharacter($event)">
  </app-character-selection>

  <!-- Écran de combat -->
  <app-combat-screen
    *ngIf="isCombatState(gameState)"
    [character]="character$ | async"
    [enemy]="enemy$ | async"
    [health]="(health$ | async) || 0"
    [message]="(message$ | async) || ''"
    [inventory]="(inventory$ | async) || []"
    (attack)="attackEnemy()"
    (useItem)="useItem($event)"
    [isPlayerAttacking]="(animationState$ | async)?.isPlayerAttacking || false"
    [isEnemyAttacking]="(animationState$ | async)?.isEnemyAttacking || false">
  </app-combat-screen>

  <!-- Écran de fin de jeu -->
  <app-game-over
    *ngIf="gameState === 'gameOver'"
    [health]="(health$ | async) || 0"
    [character]="character$ | async"
    [inventory]="(inventory$ | async) || []"
    (onRestart)="restartGame()">
  </app-game-over>

  <!-- Écran principal du jeu -->
  <div *ngIf="!isCombatState(gameState) && gameState !== 'characterSelection' && gameState !== 'gameOver'"
       class="flex flex-col items-center p-6 bg-gray-100 min-h-screen">
    <h1 class="text-3xl font-bold mb-4">RPG Board Game</h1>

    <div class="flex flex-col md:flex-row gap-6 w-full max-w-6xl">
      <div class="md:w-2/3">
        <app-game-board
          [board]="board$ | async"
          [character]="character$ | async">
        </app-game-board>
      </div>

      <div class="md:w-1/3 bg-white p-4 rounded-lg shadow-lg">
        <app-player-status
          [character]="character$ | async"
          [health]="(health$ | async) ?? 0"
          [inventory]="(inventory$ | async) || []"
          (onOpenInventory)="toggleInventory(true)">
        </app-player-status>

        <div class="mb-4">
          <h2 class="text-xl font-semibold mb-2">Message</h2>
          <div class="bg-gray-100 p-3 rounded mb-4 min-h-[80px]">
            <p>{{ message$ | async }}</p>
            <div *ngIf="(animationState$ | async)?.isMoving || (animationState$ | async)?.isTileEffectProcessing"
                 class="flex items-center mt-2">
              <div class="w-4 h-4 bg-blue-500 rounded-full animate-bounce mr-1"></div>
              <div class="w-4 h-4 bg-blue-500 rounded-full animate-bounce mr-1"
                   [style.animation-delay.ms]="200"></div>
              <div class="w-4 h-4 bg-blue-500 rounded-full animate-bounce"
                   [style.animation-delay.ms]="400"></div>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <h2 class="text-xl font-semibold mb-2">Lancer de dés</h2>
          <div class="flex items-center mb-4">
            <div class="mr-4">
              <app-dice [value]="diceResult$ | async"></app-dice>
            </div>
            <div class="bg-red-500">
              <button
                (click)="rollDice()"
                [disabled]="(isRolling$ | async) ||
                         (animationState$ | async)?.isMoving ||
                         (animationState$ | async)?.isTileEffectProcessing ||
                         gameState !== 'playing'"
                [class]="{
                'bg-gray-400 cursor-not-allowed': (isRolling$ | async) ||
                                                (animationState$ | async)?.isMoving ||
                                                (animationState$ | async)?.isTileEffectProcessing ||
                                                gameState !== 'playing',
                'bg-blue-600 hover:bg-blue-700': !(isRolling$ | async) &&
                                               !(animationState$ | async)?.isMoving &&
                                               !(animationState$ | async)?.isTileEffectProcessing &&
                                               gameState === 'playing'
              }"
                class="px-4 py-2 text-white rounded-lg font-semibold transition-colors">
                {{
                  getDiceButtonText(
                    (isRolling$ | async) ?? false,
                    (animationState$ | async)?.isMoving ?? false,
                    (animationState$ | async)?.isTileEffectProcessing ?? false,
                    gameState
                  )
                }}
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Modal pour les effets de case -->
    <app-modal
      [isOpen]="(modalState$ | async)?.isOpen ?? false"
      (onClose)="closeModal()"
      [title]="(modalState$ | async)?.title ?? '' "
      actionLabel="Continuer"
      (onAction)="handleModalAction()">
      <p>{{ (modalState$ | async)?.message }}</p>
    </app-modal>

    <!-- Modal pour l'inventaire -->
    <app-inventory-modal
      *ngIf="gameState === 'playing'"
      [isOpen]="isInventoryOpen"
      (onClose)="toggleInventory(false)"
      [inventory]="(inventory$ | async) || []"
      (onUseItem)="useItem($event)">
    </app-inventory-modal>
  </div>
</ng-container>
