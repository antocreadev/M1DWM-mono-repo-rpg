<div class="flex flex-col items-center justify-center p-6 bg-gray-100 min-h-screen">
  <h1 class="text-3xl font-bold mb-4">
    {{ hasWon ? 'Félicitations !' : 'Game Over' }}
  </h1>
  <p class="text-xl mb-8">
    {{ hasWon ? 'Vous avez terminé le tour du plateau !' : 'Vous avez été vaincu...' }}
  </p>

  <div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full mb-6">
    <h2 class="text-xl font-semibold mb-4">Résumé</h2>
    <p>Personnage : {{ character?.type }}</p>
    <p>Points de vie restants : {{ health }}</p>
    <p>Objets collectés : {{ inventory.length }}</p>
  </div>

  <button
    (click)="onRestart.emit()"
    class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
  >
    Rejouer
  </button>
</div>
