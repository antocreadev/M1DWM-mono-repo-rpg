<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-500 bg-opacity-75">
  <div class="bg-white rounded-lg shadow-lg overflow-hidden max-w-md w-full">
    <div class="p-6">
      <h2 class="text-2xl font-semibold mb-4">{{ title }}</h2>
      <ng-content></ng-content>
    </div>
    <div class="bg-gray-100 px-6 py-4 flex justify-end">
      <button class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded-lg mr-2" (click)="close()">
        Annuler
      </button>
      <button
        *ngIf="onAction.observers.length"
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
        (click)="action()"
      >
        {{ actionLabel }}
      </button>
    </div>
  </div>
</div>
